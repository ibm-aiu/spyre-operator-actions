name: Test PR

on:
  pull_request:
    paths:
      - 'scripts/patch-e2e-config.bash'
      - 'scripts/test-patch-e2e-config.bash'
      - '.github/workflows/test-patch-e2e-config.yaml'

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run patch-e2e-config tests
      run: bash scripts/test-patch-e2e-config.bash
