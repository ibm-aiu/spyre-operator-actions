name: 'Apply MachineConfig'
description: 'Apply the Spyre device plugin SELinux MachineConfig to the CRC master node and restart the cluster'

inputs:
  working-directory:
    description: 'Directory containing the spyre-operator checkout'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Apply MachineConfig
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        #!/bin/bash -eu

        oc patch mcp master --type=merge -p '{"spec":{"paused":true}}'
        oc get mcp master -o jsonpath="{.status.configuration} {.spec.configuration}"
        echo "Apply MachineConfig"
        cat config/machineconfig/amd64/50-spyre-device-plugin-selinux-minimal.yaml \
          | sed -e 's@machineconfiguration.openshift.io/role: worker@machineconfiguration.openshift.io/role: master@g' \
          | oc apply -f -
        sleep 10
        oc get mcp master -o jsonpath="{.status.configuration} {.spec.configuration}"
        oc patch mcp master --type=merge -p '{"spec":{"paused":false}}'

        sleep 60
        sudo -su $USER crc stop -f
        # Give the VM time to fully shut down before restarting
        sleep 30

        # Retry crc start up to 3 times — under runner load the internal API
        # server readiness check can time out on the first attempt.
        CRC_START_RETRIES=0
        CRC_START_MAX=3
        while [ $CRC_START_RETRIES -lt $CRC_START_MAX ]; do
          echo "Starting CRC (attempt $((CRC_START_RETRIES+1))/$CRC_START_MAX)..."
          if sudo -su $USER crc start; then
            echo "CRC started successfully."
            break
          fi
          CRC_START_RETRIES=$((CRC_START_RETRIES+1))
          if [ $CRC_START_RETRIES -lt $CRC_START_MAX ]; then
            echo "crc start failed — stopping and retrying in 60s..."
            sudo -su $USER crc stop -f || true
            sleep 60
          else
            echo "ERROR: crc start failed after $CRC_START_MAX attempts."
            exit 1
          fi
        done

        while : ; do
            if oc login -u kubeadmin -p $(cat ~/.crc/machines/crc/kubeadmin-password) https://api.crc.testing:6443 --insecure-skip-tls-verify=true ; then
                echo "Successful re-login into openshift"
                break
            else
                echo "Retrying login..."
                sleep 5
            fi
        done
        oc wait clusteroperator/image-registry --for=condition=Available=True --timeout=10m
        oc get po -n openshift-marketplace
        oc get mcp
