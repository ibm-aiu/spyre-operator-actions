name: 'Install Stern'
description: 'Install stern CLI tool for Kubernetes log tailing'

inputs:
  version:
    description: 'Stern version to install'
    required: false
    default: '1.30.0'

runs:
  using: 'composite'
  steps:
    - name: Install stern
      shell: bash
      env:
        STERN_VERSION: ${{ inputs.version }}
      run: |
        #!/bin/bash -eu

        # Install stern for log capture
        if ! command -v stern &> /dev/null; then
          ARCH="$(uname -m)"

          case "${ARCH}" in
            x86_64)
              STERN_ARCH="amd64"
              ;;
            aarch64|arm64)
              STERN_ARCH="arm64"
              ;;
            ppc64le)
              STERN_ARCH="ppc64le"
              ;;
            s390x)
              STERN_ARCH="s390x"
              ;;
            *)
              echo "Unsupported architecture: ${ARCH}"
              exit 1
              ;;
          esac

          # Check whether an existing stern binary is usable.
          if command -v stern >/dev/null 2>&1; then
            if stern --version >/dev/null 2>&1; then
              echo "stern is already installed and usable:"
              stern --version
              exit 0
            fi

            echo "Existing stern binary is not usable on this architecture."
            echo "Removing existing binary..."
            sudo rm -f "$(command -v stern)"
          fi
    
          STERN_TARBALL="stern_${STERN_VERSION}_linux_${STERN_ARCH}.tar.gz"
          STERN_URL="https://github.com/stern/stern/releases/download/v${STERN_VERSION}/${STERN_TARBALL}"

          echo "Installing Stern ${STERN_VERSION}"
          echo "Architecture: ${ARCH}"
          echo "Stern architecture: ${STERN_ARCH}"
          echo "Download URL: ${STERN_URL}"

          curl --fail --retry 5 -L \
            "${STERN_URL}" \
            -o stern.tar.gz
          tar -xzf stern.tar.gz
          sudo mv stern /usr/local/bin/
          sudo chmod +x /usr/local/bin/stern
          rm stern.tar.gz
        else
          echo "stern already installed"
        fi

        # Verify installation
        stern --version
